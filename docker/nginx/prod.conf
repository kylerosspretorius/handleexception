server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashboard.handleexception.com;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/dashboard.handleexception.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.handleexception.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(css|js|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|svg)$ {
        try_files $uri /index.php?$query_string;
    }
}
