services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handleexception_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - PHP_OPCACHE_ENABLE=0
    networks:
      - handleexception
    depends_on:
      - mysql

  nginx:
    image: nginx:1.25-alpine
    container_name: handleexception_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - handleexception
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: handleexception_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-handleexception_invoices}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-invoice_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-invoice_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - handleexception

networks:
  handleexception:
    driver: bridge

volumes:
  mysql_data:
